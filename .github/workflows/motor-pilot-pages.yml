name: Publish SAT motor pilot web

on:
  push:
    branches: [main]
    paths:
      - 'bldc_tuner_windows/**'
      - '.github/workflows/motor-pilot-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sat-motor-pilot-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static web files
        run: |
          mkdir -p _site
          cp bldc_tuner_windows/index.html bldc_tuner_windows/styles.css bldc_tuner_windows/app.js bldc_tuner_windows/i18n.js bldc_tuner_windows/chart_scale.js bldc_tuner_windows/rt_charts.js bldc_tuner_windows/scope_plot.js bldc_tuner_windows/somboon-logo.png bldc_tuner_windows/sat_motor_pilot.ico _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
