name: Firmware or documentation bug
description: Report a reproducible defect without requesting unsafe powered testing.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not connect a motor or increase power limits only to reproduce a problem. Record the safest condition that demonstrates the issue.
  - type: input
    id: revision
    attributes:
      label: Board revision
      description: PCB revision, schematic date, or other unique hardware identifier.
      placeholder: "V.Phase2_v02 / 2026-08-01"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Firmware commit
      placeholder: "git rev-parse HEAD"
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: Test state
      options:
        - Logic only, VSUPPLY disconnected
        - Motor disconnected, current-limited supply
        - Motor connected, current-limited bench test
        - Documentation or build only
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: State what happened, what you expected, and the exact command or sequence used.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, measurements or scope-capture links. Include supply voltage and current limit when powered.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not disable protection or raise operating limits to reproduce this issue.
          required: true
